<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1030"/>
      <stop offset="1" stop-color="#05081c"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ab6ff"/>
      <stop offset="1" stop-color="#3366ff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#2b56c8" stroke-width="2"/>
  <!-- prompt chevron  > -->
  <polyline points="16,20 28,32 16,44" fill="none" stroke="url(#fg)"
            stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- cursor underscore  _ -->
  <rect x="33" y="42.5" width="17" height="5" rx="2.5" fill="url(#fg)"/>
</svg>
